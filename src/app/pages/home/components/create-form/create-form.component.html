<p-toast position="top-center" class="p-toast"></p-toast>

<section class="create-form">
  <div class="card">
    <div class="title">{{ 'CREATE_FORM.TITLE' | translate }}</div>
    <div class="subtitle">{{ 'CREATE_FORM.SUBTITLE' | translate }}</div>

    <form [formGroup]="formGroup" class="p-fluid p-grid">
      <!-- Equipo -->

      <input type="text" [placeholder]="'CREATE_FORM.TEAM_PLACEHOLDER' | translate" pInputText type="text" formControlName="team" />
    </form>

    <div class="buttons mt-4">
      <button pButton class="p-button-raised p-button-primary" (click)="back.emit()">{{ 'CREATE_FORM.BACK' | translate }}</button>
      <button
        pButton
        class="p-button-raised p-button-primary"
        [disabled]="!formGroup.valid && !isLoading"
        (click)="createSesion()"
      >
        <p-progressSpinner
          *ngIf="isLoading"
          [style]="{ width: '50px', height: '50px' }"
          fill="white"
          styleClass="custom-spinner"
          strokeWidth="8"
        ></p-progressSpinner>
        {{ 'CREATE_FORM.CREATE' | translate }}
      </button>
    </div>
  </div>
</section>
