<p-toast position="top-center" class="p-toast"></p-toast>

<section class="create-form">
  <div class="card">
    <div class="title">{{ 'PARTICIPATE.TITLE' | translate }}</div>
    <div class="subtitle">{{ 'PARTICIPATE.SUBTITLE' | translate }}</div>
    <span class="p-input-icon-right">
      <i class="pi pi-search"></i>
      <input type="text" [placeholder]="'PARTICIPATE.CODE_PLACEHOLDER' | translate" pInputText [(ngModel)]="sesionId" />
    </span>

    <div class="buttons mt-4 mb-2">
      <button pButton class="p-button-raised p-button-primary" (click)="goBack.emit()">{{ 'PARTICIPATE.BACK' | translate }}</button>
      <button
        [disabled]="sesionId?.length > 5 ? false : true"
        pButton
        class="p-button-raised p-button-primary"
        (click)="goToSesion()"
      >
        {{ 'PARTICIPATE.ENTER' | translate }}
      </button>
    </div>
  </div>
</section>
