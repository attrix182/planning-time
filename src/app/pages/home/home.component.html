<div class="landing-icon" [pTooltip]="'HOME.INFO_TOOLTIP' | translate">
  <i (click)="goToLanding()" class="pi pi-info-circle"></i>
</div>

<div class="language-selector">
  <p-dropdown 
    [options]="languages" 
    [(ngModel)]="currentLanguage" 
    optionLabel="label" 
    optionValue="code"
    (onChange)="changeLanguage($event.value)"
    [style]="{'width': '150px'}"
    placeholder="{{ 'COMMON.LANGUAGE' | translate }}">
  </p-dropdown>
</div>

<div class="home-page">
  <section
    class="welcome-card"
    *ngIf="!showCreate && !succesfullyCreate && !showParticipate && !isLoading"
    [@exitAnimationY]
  >
    <h2 class="title text-center">{{ 'HOME.WELCOME' | translate }}</h2>
    <div class="subtitle">
      {{ 'HOME.WHAT_DO' | translate }}
      <div class="buttons">
        <button pButton pRipple class="p-button-raised p-button-primary" (click)="toggleShowCreate()">{{ 'HOME.CREATE' | translate }}</button>
        <button pButton pRipple class="p-button-raised p-button-primary" (click)="toggleShowParticipate()">
          {{ 'HOME.PARTICIPATE' | translate }}
        </button>
      </div>
    </div>
  </section>

  <section *ngIf="showCreate && !isLoading" [@enterAnimationY]>
    <fc-create-form (back)="toggleShowCreate()" (nextStep)="handleID($event)"></fc-create-form>
  </section>

  <section *ngIf="succesfullyCreate && !isLoading" [@enterAnimationY]>
    <fc-succesfully-create [event]="event"></fc-succesfully-create>
  </section>

  <section *ngIf="showParticipate && !succesfullyCreate" [@enterAnimationY]>
    <fc-participate (back)="toggleShowParticipate()" [id]="eventID"></fc-participate>
  </section>

  <section class="skeleton-container">
    <p-skeleton *ngIf="isLoading" class="skeleton" width="45vw" height="60vh"></p-skeleton>
  </section>

  <div id="landing-image"></div>
</div>
