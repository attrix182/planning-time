<section class="admin-modal">
  <div class="admin-modal_card">
    <div class="admin-modal_card_header">
      <div class="admin-modal_card_header_title"><i class="pi pi-user"></i> &nbsp; {{ 'ADMIN_PROFILE.TITLE' | translate }}</div>
      <div class="admin-modal_card_header_actions"></div>
    </div>
    <div class="admin-modal_card_body">
      <div class="admin-modal_card_body-select-language">
        <div class="admin-modal_card_body-select-language_title">
          {{ 'COMMON.LANGUAGE' | translate }}
        </div>
        <p-dropdown 
          [options]="languages" 
          [(ngModel)]="currentLanguage" 
          optionLabel="label" 
          optionValue="code"
          (onChange)="changeLanguage($event.value)"
          placeholder="{{ 'COMMON.LANGUAGE' | translate }}">
        </p-dropdown>
      </div>
      <div class="admin-modal_card_body_name-section">
        <div class="name-label">{{ 'ADMIN_PROFILE.CURRENT_NAME' | translate }}</div>
        <div class="name-value"><strong>{{ userActive?.name }}</strong></div>
        <button
          pButton
          pRipple
          [label]="'ADMIN_PROFILE.CHANGE_NAME' | translate"
          (click)="changeName()"
          class="p-button-raised p-button-primary change-name-button"
        ></button>
      </div>

      <div
        class="card flex justify-content-center admin-modal_card_body_facilitator"
        [pTooltip]="'ADMIN_PROFILE.FACILITATOR_TOOLTIP' | translate"
      >
        <label>{{ 'ADMIN_PROFILE.FACILITATOR_LABEL' | translate }}</label>
        <p-inputSwitch
          class="admin-modal_card_body_facilitator-switch"
          [(ngModel)]="userActive.facilitator"
        ></p-inputSwitch>
      </div>

      <div class="admin-modal_card_body_notifications">
        <div class="admin-modal_card_body_notifications_title">
          <i class="pi pi-bell"></i> {{ 'ADMIN_PROFILE.NOTIFICATIONS' | translate }}
        </div>
        <div class="admin-modal_card_body_notifications_item">
          <label>{{ 'ADMIN_PROFILE.SOUNDS' | translate }}</label>
          <p-inputSwitch
            [(ngModel)]="notificationSettings.soundsEnabled"
            (onChange)="updateNotificationSettings('soundsEnabled', $event.checked)"
          ></p-inputSwitch>
        </div>
        <div class="admin-modal_card_body_notifications_item">
          <label>{{ 'ADMIN_PROFILE.VIBRATIONS' | translate }}</label>
          <p-inputSwitch
            [(ngModel)]="notificationSettings.vibrationsEnabled"
            (onChange)="updateNotificationSettings('vibrationsEnabled', $event.checked)"
          ></p-inputSwitch>
        </div>
        <div class="admin-modal_card_body_notifications_item">
          <label>{{ 'ADMIN_PROFILE.TOAST_NOTIFICATIONS' | translate }}</label>
          <p-inputSwitch
            [(ngModel)]="notificationSettings.toastEnabled"
            (onChange)="updateNotificationSettings('toastEnabled', $event.checked)"
          ></p-inputSwitch>
        </div>
      </div>
    </div>
    <footer class="admin-modal_card_footer">
      <div class="admin-modal_card_footer_actions">
        <!--         <button
          pButton
          pRipple
          [label]="'COMMON.CANCEL' | translate"
          (click)="closeModal()"
          class="p-button-raised p-button-outlined p-button-primary"
        ></button> -->
        <button
          pButton
          pRipple
          [label]="'COMMON.ACCEPT' | translate"
          (click)="saveAndClose()"
          class="p-button-raised p-button-primary"
        ></button>
      </div>
    </footer>
  </div>
</section>
