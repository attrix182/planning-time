<section class="admin-modal">
  <div class="admin-modal_card">
    <div class="admin-modal_card_header">
      <div class="admin-modal_card_header_title"><i class="pi pi-user"></i> &nbsp; {{ 'ADMIN_PROFILE.TITLE' | translate }}</div>
      <div class="admin-modal_card_header_actions"></div>
    </div>
    <div class="admin-modal_card_body">
      <div class="admin-modal_card_body-select-language">
        <div class="admin-modal_card_body-select-language_title">
          {{ 'COMMON.LANGUAGE' | translate }}
        </div>
        <p-dropdown 
          [options]="languages" 
          [(ngModel)]="currentLanguage" 
          optionLabel="label" 
          optionValue="code"
          (onChange)="changeLanguage($event.value)"
          placeholder="{{ 'COMMON.LANGUAGE' | translate }}">
        </p-dropdown>
      </div>
      <div>
        {{ 'ADMIN_PROFILE.CURRENT_NAME' | translate }} <strong>{{ userActive?.name }}</strong>
      </div>

      <button
        pButton
        pRipple
        [label]="'ADMIN_PROFILE.CHANGE_NAME' | translate"
        (click)="changeName()"
        class="p-button-raised p-button-primary"
      ></button>

      <div
        class="card flex justify-content-center admin-modal_card_body_facilitator"
        [pTooltip]="'ADMIN_PROFILE.FACILITATOR_TOOLTIP' | translate"
      >
        <label>{{ 'ADMIN_PROFILE.FACILITATOR_LABEL' | translate }}</label>
        <p-inputSwitch
          class="admin-modal_card_body_facilitator-switch"
          [(ngModel)]="userActive.facilitator"
        ></p-inputSwitch>
      </div>
    </div>
    <footer class="admin-modal_card_footer">
      <div class="admin-modal_card_footer_actions">
        <!--         <button
          pButton
          pRipple
          [label]="'COMMON.CANCEL' | translate"
          (click)="closeModal()"
          class="p-button-raised p-button-outlined p-button-primary"
        ></button> -->
        <button
          pButton
          pRipple
          [label]="'COMMON.ACCEPT' | translate"
          (click)="saveAndClose()"
          class="p-button-raised p-button-primary"
        ></button>
      </div>
    </footer>
  </div>
</section>
